version: '3.8'

services:
  contracts-node:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: trustchain-anvil
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"

  api-backend:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: trustchain-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - RPC_URL=http://contracts-node:8545
    depends_on:
      - contracts-node

  web-frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: trustchain-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - api-backend
